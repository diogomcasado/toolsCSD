<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>toolsCSD — Multi Tool</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <div>
    <h1><a href="https://github.com/diogomcasado/toolsCSD" class="site-title-link">toolsCSD</a></h1>
  </div>
  <button class="theme-toggle" id="themeToggle" title="Alternar tema" aria-label="Alternar tema claro/escuro">
    <span class="icon" id="themeIcon">🌙</span>
  </button>
</header>

<nav class="tabs">
  <button class="tab-btn active" data-tab="password">Passwords</button>
  <button class="tab-btn" data-tab="base64">Base64</button>
  <button class="tab-btn" data-tab="hash">Hash</button>
  <button class="tab-btn" data-tab="json">JSON Formatter</button>
  <button class="tab-btn" data-tab="urlcodec">URL Encoder</button>
  <button class="tab-btn" data-tab="uuid">UUID</button>
  <button class="tab-btn" data-tab="color">Cores</button>
  <button class="tab-btn" data-tab="cron">Cron</button>
  <button class="tab-btn" data-tab="qr">QR Code</button>
</nav>

<main>
  <div class="panel">

    <!-- PASSWORD GENERATOR -->
    <section id="password" class="tool-page active">

      <div class="pw-output">
        <input id="pwField" type="text" readonly aria-label="Password gerada">
        <button class="icon-btn" id="copyBtn" title="Copiar">📋</button>
        <button class="icon-btn" id="regenBtn" title="Gerar nova">🔄</button>
      </div>

      <div class="strength">
        <div class="strength-bar"><div class="strength-bar-fill" id="strengthFill"></div></div>
        <div class="strength-label" id="strengthLabel">Força: —</div>
      </div>

      <div class="options-grid">
        <div class="length-row">
          <label for="lengthRange">Comprimento</label>
          <input type="range" id="lengthRange" min="4" max="64" value="16">
          <span class="length-value" id="lengthValue">16</span>
        </div>

        <label class="checkbox-row">
          <input type="checkbox" id="optUpper" checked>
          Letras maiúsculas (A-Z)
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="optLower" checked>
          Letras minúsculas (a-z)
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="optNumbers" checked>
          Números (0-9)
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="optSymbols" checked>
          Símbolos (!@#$%...)
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="optExcludeSimilar">
          Excluir carateres semelhantes (l, 1, I, O, 0)
        </label>

        <label class="checkbox-row">
          <input type="checkbox" id="optExcludeAmbiguous">
          Excluir símbolos ambíguos ({ } [ ] ( ) / \ etc.)
        </label>
      </div>

      <hr class="divider">

      <div class="actions-row">
        <button class="btn-primary" id="generateBtn">Gerar Password</button>
        <button class="icon-btn mobile-copy-btn" id="copyBtnMobile" title="Copiar">📋</button>
        <div class="qty-row">
          <label for="qtyInput">Gerar várias:</label>
          <input type="number" id="qtyInput" min="1" max="20" value="1">
        </div>
      </div>

      <div class="batch-list" id="batchList"></div>

    </section>

    <!-- BASE64 -->
    <section id="base64" class="tool-page">
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="encode" id="b64ModeEncode">Codificar</button>
        <button class="mode-btn" data-mode="decode" id="b64ModeDecode">Descodificar</button>
      </div>

      <label class="field-label" for="b64Input">Texto de entrada</label>
      <textarea class="textarea-field" id="b64Input" placeholder="Escreve ou cola o texto aqui..."></textarea>

      <div class="actions-row" style="margin-top: 16px;">
        <button class="btn-primary" id="b64ConvertBtn">Converter</button>
      </div>

      <div class="error-box" id="b64Error"></div>

      <label class="field-label" style="margin-top: 16px;">Resultado</label>
      <div class="pw-output" style="margin-bottom: 0;">
        <textarea class="textarea-field" id="b64Output" readonly></textarea>
        <button class="icon-btn" id="b64CopyBtn" title="Copiar">📋</button>
      </div>
    </section>

    <!-- HASH GENERATOR -->
    <section id="hash" class="tool-page">
      <label class="field-label" for="hashInput">Texto de entrada</label>
      <textarea class="textarea-field" id="hashInput" placeholder="Escreve ou cola o texto aqui..."></textarea>

      <div class="hash-list" id="hashList">
        <div class="hash-item"><span class="hash-algo">MD5</span><span class="hash-value" data-algo="MD5"></span><button data-algo="MD5">Copiar</button></div>
        <div class="hash-item"><span class="hash-algo">SHA-1</span><span class="hash-value" data-algo="SHA-1"></span><button data-algo="SHA-1">Copiar</button></div>
        <div class="hash-item"><span class="hash-algo">SHA-256</span><span class="hash-value" data-algo="SHA-256"></span><button data-algo="SHA-256">Copiar</button></div>
        <div class="hash-item"><span class="hash-algo">SHA-384</span><span class="hash-value" data-algo="SHA-384"></span><button data-algo="SHA-384">Copiar</button></div>
        <div class="hash-item"><span class="hash-algo">SHA-512</span><span class="hash-value" data-algo="SHA-512"></span><button data-algo="SHA-512">Copiar</button></div>
      </div>
    </section>

    <!-- JSON FORMATTER -->
    <section id="json" class="tool-page">
      <label class="field-label" for="jsonInput">JSON de entrada</label>
      <textarea class="textarea-field" id="jsonInput" placeholder='{"exemplo": [1, 2, 3]}'></textarea>

      <div class="actions-row" style="margin-top: 16px;">
        <button class="btn-primary" id="jsonFormatBtn">Formatar</button>
        <button class="icon-btn" id="jsonMinifyBtn">Minificar</button>
      </div>

      <div class="error-box" id="jsonError"></div>

      <label class="field-label" style="margin-top: 16px;">Resultado</label>
      <div class="pw-output" style="margin-bottom: 0;">
        <textarea class="textarea-field" id="jsonOutput" readonly></textarea>
        <button class="icon-btn" id="jsonCopyBtn" title="Copiar">📋</button>
      </div>
    </section>

    <!-- URL ENCODER/DECODER -->
    <section id="urlcodec" class="tool-page">
      <div class="mode-toggle">
        <button class="mode-btn active" data-mode="encode" id="urlModeEncode">Codificar</button>
        <button class="mode-btn" data-mode="decode" id="urlModeDecode">Descodificar</button>
      </div>

      <label class="field-label" for="urlInput">Texto ou URL de entrada</label>
      <textarea class="textarea-field" id="urlInput" placeholder="https://exemplo.com/?q=texto com espaços"></textarea>

      <div class="actions-row" style="margin-top: 16px;">
        <button class="btn-primary" id="urlConvertBtn">Converter</button>
      </div>

      <div class="error-box" id="urlError"></div>

      <label class="field-label" style="margin-top: 16px;">Resultado</label>
      <div class="pw-output" style="margin-bottom: 0;">
        <textarea class="textarea-field" id="urlOutput" readonly></textarea>
        <button class="icon-btn" id="urlCopyBtn" title="Copiar">📋</button>
      </div>
    </section>

    <!-- UUID GENERATOR -->
    <section id="uuid" class="tool-page">
      <div class="pw-output">
        <input id="uuidField" type="text" readonly aria-label="UUID gerado">
        <button class="icon-btn" id="uuidCopyBtn" title="Copiar">📋</button>
        <button class="icon-btn" id="uuidRegenBtn" title="Gerar novo">🔄</button>
      </div>

      <div class="options-grid" style="margin-bottom: 0;">
        <label class="checkbox-row">
          <input type="checkbox" id="uuidUpper">
          Maiúsculas
        </label>
        <label class="checkbox-row">
          <input type="checkbox" id="uuidNoDashes">
          Sem hífens
        </label>
      </div>

      <hr class="divider">

      <div class="actions-row">
        <button class="btn-primary" id="uuidGenerateBtn">Gerar UUID</button>
        <div class="qty-row">
          <label for="uuidQty">Gerar vários:</label>
          <input type="number" id="uuidQty" min="1" max="20" value="1">
        </div>
      </div>

      <div class="batch-list" id="uuidBatchList"></div>
    </section>

    <!-- COLOR CONVERTER -->
    <section id="color" class="tool-page">
      <div class="color-preview">
        <div class="swatch" id="colorSwatch"></div>
        <input type="color" id="colorPicker" value="#7c5cff">
      </div>

      <div class="color-grid">
        <div class="color-field-group">
          <label for="hexInput">HEX</label>
          <input type="text" id="hexInput" value="#7c5cff" maxlength="7">
          <button class="icon-btn" id="hexCopyBtn" title="Copiar">📋</button>
        </div>

        <div class="color-field-group">
          <label>RGB</label>
          <input type="number" id="rInput" min="0" max="255">
          <input type="number" id="gInput" min="0" max="255">
          <input type="number" id="bInput" min="0" max="255">
        </div>

        <div class="color-field-group">
          <label>HSL</label>
          <input type="number" id="hInput" min="0" max="360">
          <input type="number" id="sInput" min="0" max="100">
          <input type="number" id="lInput" min="0" max="100">
        </div>
      </div>
    </section>

    <!-- CRON EXPRESSION PARSER/CREATOR -->
    <section id="cron" class="tool-page">
      <div class="cron-expression-row">
        <input type="text" id="cronExpression" value="0 9 * * 1-5" spellcheck="false" aria-label="Expressão cron">
        <button class="icon-btn" id="cronCopyBtn" title="Copiar">📋</button>
      </div>
      <div class="cron-legend">Formato: minuto hora dia-do-mês mês dia-da-semana (dia-da-semana: 0-7, onde 0 e 7 são domingo)</div>

      <div class="preset-row">
        <button class="preset-btn" data-cron="* * * * *">A cada minuto</button>
        <button class="preset-btn" data-cron="0 * * * *">A cada hora</button>
        <button class="preset-btn" data-cron="0 0 * * *">Diariamente à meia-noite</button>
        <button class="preset-btn" data-cron="0 9 * * 1-5">Dias úteis às 9h</button>
        <button class="preset-btn" data-cron="0 0 * * 0">Semanalmente (domingo)</button>
        <button class="preset-btn" data-cron="0 0 1 * *">Mensalmente (dia 1)</button>
        <button class="preset-btn" data-cron="0 0 1 1 *">Anualmente (1 jan)</button>
      </div>

      <div class="cron-fields-grid">
        <div class="cron-field">
          <label for="cronMinute">Minuto</label>
          <input type="text" id="cronMinute" value="0">
          <div class="range-hint">0-59</div>
        </div>
        <div class="cron-field">
          <label for="cronHour">Hora</label>
          <input type="text" id="cronHour" value="9">
          <div class="range-hint">0-23</div>
        </div>
        <div class="cron-field">
          <label for="cronDom">Dia do mês</label>
          <input type="text" id="cronDom" value="*">
          <div class="range-hint">1-31</div>
        </div>
        <div class="cron-field">
          <label for="cronMonth">Mês</label>
          <input type="text" id="cronMonth" value="*">
          <div class="range-hint">1-12 ou JAN-DEC</div>
        </div>
        <div class="cron-field">
          <label for="cronDow">Dia da semana</label>
          <input type="text" id="cronDow" value="1-5">
          <div class="range-hint">0-7 ou SUN-SAT</div>
        </div>
      </div>

      <div class="cron-description" id="cronDescription"></div>

      <label class="field-label">Próximas execuções</label>
      <div class="cron-next-runs" id="cronNextRuns"></div>
    </section>

    <!-- QR CODE GENERATOR -->
    <section id="qr" class="tool-page">
      <label class="field-label" for="qrText">Texto ou URL</label>
      <textarea class="textarea-field" id="qrText" placeholder="https://exemplo.com ou qualquer texto">https://github.com/diogomcasado/toolsCSD</textarea>

      <div class="qr-options-grid">
        <div class="cron-field">
          <label for="qrErrorLevel">Correção de erro</label>
          <select id="qrErrorLevel" class="select-field">
            <option value="L">L (~7%)</option>
            <option value="M" selected>M (~15%)</option>
            <option value="Q">Q (~25%)</option>
            <option value="H">H (~30%)</option>
          </select>
        </div>
        <div class="cron-field">
          <label for="qrSize">Tamanho</label>
          <select id="qrSize" class="select-field">
            <option value="128">128px</option>
            <option value="256" selected>256px</option>
            <option value="320">320px</option>
            <option value="400">400px</option>
          </select>
        </div>
        <div class="cron-field">
          <label for="qrColorDark">Cor</label>
          <input type="color" id="qrColorDark" value="#000000">
        </div>
        <div class="cron-field">
          <label for="qrColorLight">Fundo</label>
          <input type="color" id="qrColorLight" value="#ffffff">
        </div>
      </div>

      <div class="error-box" id="qrError"></div>

      <div class="qr-preview">
        <canvas id="qrCanvas"></canvas>
      </div>

      <div class="actions-row">
        <button class="btn-primary" id="qrDownloadBtn">Descarregar PNG</button>
      </div>
    </section>

  </div>
</main>

<footer>
  <a class="github-button" href="https://github.com/diogomcasado"
      data-color-scheme="no-preference: dark_dimmed; light: dark_dimmed; dark: dark_dimmed;" data-size="large"
      aria-label="Follow @diogomcasado on GitHub">Follow @diogomcasado</a>
  <a class="github-button" href="https://github.com/diogomcasado/toolsCSD"
      data-color-scheme="no-preference: dark_dimmed; light: dark_dimmed; dark: dark_dimmed;" data-icon="octicon-eye" data-size="large"
      aria-label="Ver diogomcasado/toolsCSD no GitHub">diogomcasado/toolsCSD</a>
</footer>
<script async defer src="https://buttons.github.io/buttons.js"></script>

<div class="toast" id="toast">Copiado!</div>

<script src="script.js"></script>
</body>
</html>
